server:
  port: 8066


spring:
  application:
    name: enterprise-ops-agent
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  ai:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL}
    embedding-base-url: ${LLM_EMBEDDING_BASE_URL}
    model-name: ${LLM_MODEL_NAME:qwen3.8-27b}
    temperature: 0.1
    timeout-seconds: 60
  rag:
    # keyword?????????????????????
    # vector ??????????????? /v1/embeddings ???
    mode: vector
    embedding-model-name: ${LLM_EMBEDDING_MODEL_NAME}
    top-k: 5
    dimension: 1024
    rrf-k: 60
    min-score: 0.35 # 向量相似度阈值(中文问句与文档片段的 cosine 相似度普遍在 0.3~0.6,0.5 会过滤掉大量有效命中)
    chunk-size: 1000                    # 分块大小
    chunk-overlap: 150                  # 分块重叠

    diagnose:
      max-duration-seconds: 120    # ?????? TIMED_OUT
      model-retry-max-attempts: 3  # ??????????
      model-retry-backoff-ms: 1000 # ????????????
  tools:
    # ???????????????????????????????????
    service-whitelist: order-service,user-service,payment-service
    log-max-rows: 20
  es:
    url: https://localhost:9200
    username: elastic
    password: UrRUCP34qKwxosTcP3n9
    index: knowledge-chunks
    dimension: 1024
  diagnose:
    max-duration-seconds: 120
    model-retry-max-attempts: 3
    model-retry-backoff-ms: 1000
  auth:
    jwt-secret: M3M6SMt2wWukRuAvGpdCrWZKt4Xd8Fa7
    jwt-expire-minutes: 120
  actions:
    mode: webhook
    webhook-url: https://webhook.uutool.cn/95b108d8-3726-499a-975c-36fc8a058902
  ops:
    mode: mock      # mock | es —— 数据源切换：单配置文件里改一个词
